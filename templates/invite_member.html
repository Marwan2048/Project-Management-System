{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invite Member - {{ project.title }}</title>
    <link rel="stylesheet" href="{% static 'workflow/css/auth.css' %}">
</head>
<body class="dashboard-shell">
    <main class="dashboard-content">
        <section class="invite-card">
            <h1>Invite Member</h1>
            <p class="invite-meta">Project: {{ project.title }}</p>

            {% if error_message %}
                <div class="msg msg-error">{{ error_message }}</div>
            {% endif %}

            {% if success_message %}
                <div class="msg msg-success">{{ success_message }}</div>
            {% endif %}

            <form method="post" class="invite-form">
                {% csrf_token %}
                <label for="user_email">Email</label>
                <input
                    type="email"
                    id="user_email"
                    name="user_email"
                    placeholder="member@example.com"
                    required
                >

                <div class="invite-actions">
                    <button type="submit" class="btn-primary">Send Invitation</button>
                    <a href="{% url 'detail_project' project.id %}" class="btn-secondary">Back to Project</a>
                </div>
            </form>
        </section>
    </main>

    <style>
        .invite-card {
            max-width: 560px;
            margin: 0 auto;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
        }

        .invite-card h1 {
            margin: 0 0 8px;
            font-size: 1.7rem;
            color: #f8fafc;
        }

        .invite-meta {
            margin: 0 0 18px;
            color: #94a3b8;
        }

        .msg {
            margin-bottom: 12px;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .msg-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fecaca;
        }

        .msg-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.35);
            color: #bbf7d0;
        }

        .invite-form {
            display: grid;
            gap: 12px;
        }

        .invite-form label {
            color: #cbd5e1;
            font-weight: 600;
        }

        .invite-form input {
            padding: 11px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(15, 23, 42, 0.7);
            color: #f8fafc;
        }

        .invite-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .btn-secondary,
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: #f4f7ff;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 200ms ease;
        }

        .btn-primary {
            background: rgba(56, 189, 248, 0.12);
            border-color: rgba(56, 189, 248, 0.35);
            color: #7dd3fc;
        }

        .btn-primary:hover,
        .btn-secondary:hover {
            transform: translateY(-1px);
        }
    </style>
</body>
</html>
