{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ object.title }} - Project</title>
    <link rel="stylesheet" href="{% static 'workflow/css/auth.css' %}">
</head>
<body class="dashboard-shell">
    <header class="page-header">
        <div>
            <h1>{{ project.title }}</h1>
            <p class="project-meta">Stages for this project</p>
        </div>
    </header>

    <main class="dashboard-content">
        <div class="content-wrap">
            <div class="stages">
                {% for stage in project.stages.all %}
                    <section class="stage">
                        <div class="stage-header">
                            <h3>{{ stage.title }}</h3>
                        </div>
                    </section>
                {% empty %}
                    <p style="color:#777">No stages added yet.</p>
                {% endfor %}
            </div>
        </div>
    </main>
</body>
</html>
