{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ object.title }} - Project</title>
    <link rel="stylesheet" href="{% static 'workflow/css/auth.css' %}">
</head>
<body class="dashboard-shell">
    <header class="page-header">
        <div>
            <h1>{{ project.title }}</h1>
            <p class="project-meta">Stages for this project</p>
        </div>
        <div class="header-actions">
            <a href="{% url 'update_project' project.id %}" class="btn-secondary" title="Edit project">
                <svg width="18" height="18" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.5 13.5H3.16L11.35 5.31L10.69 4.65L2.5 12.84V13.5Z" fill="currentColor"/>
                    <path d="M13.85 3.15L12.85 2.15L13.52 1.48C13.86 1.14 14.42 1.14 14.76 1.48L15.52 2.24C15.86 2.58 15.86 3.14 15.52 3.48L13.85 3.15Z" fill="currentColor"/>
                </svg>
                Edit
            </a>
            <a href="{% url 'delete_project' project.id %}" class="btn-danger" title="Delete project">
                <svg width="18" height="18" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M13 3H10V2H6V3H3V4H4V13C4 13.55 4.45 14 5 14H11C11.55 14 12 13.55 12 13V4H13V3ZM6 12H5V5H6V12ZM8 12H7V5H8V12ZM10 12H9V5H10V12Z" fill="currentColor"/>
                </svg>
                Delete
            </a>
        </div>
    </header>

    <main class="dashboard-content">
        <div class="content-wrap">
            <div class="stages">
                {% for stage in project.stages.all %}
                    <section class="stage">
                        <div class="stage-header">
                            <h3>{{ stage.title }}</h3>
                        </div>
                    </section>
                {% empty %}
                    <p style="color:#777">No stages added yet.</p>
                {% endfor %}
            </div>
        </div>
    </main>

    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-size: 2rem;
            letter-spacing: -0.04em;
            font-weight: 700;
        }

        .page-header .project-meta {
            margin: 0;
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .btn-secondary,
        .btn-danger {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: #f4f7ff;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 200ms ease;
        }

        .btn-secondary:hover {
            background: rgba(94, 90, 255, 0.15);
            border-color: rgba(94, 90, 255, 0.5);
            color: #c4b5fd;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: rgba(253, 164, 175, 0.08);
            border-color: rgba(253, 164, 175, 0.3);
            color: #fca5b0;
        }

        .btn-danger:hover {
            background: rgba(253, 164, 175, 0.15);
            border-color: rgba(253, 164, 175, 0.5);
            color: #fda4af;
            transform: translateY(-2px);
        }

        .btn-secondary svg,
        .btn-danger svg {
            width: 16px;
            height: 16px;
        }
    </style>
