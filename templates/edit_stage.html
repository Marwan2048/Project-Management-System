{% extends 'base_auth.html' %}
{% block title %}Edit Stage - SprintHub{% endblock %}

{% block content %}
    <div class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h1>Edit Stage</h1>
                <p>Rename this workflow stage.</p>
                <a href="{% url 'detail_project' stage.project.id %}" class="modal-close">&times;</a>
            </div>

            <form method="post" class="project-form">
                {% csrf_token %}
                {{ form.non_field_errors }}

                <div class="input-group">
                    <label for="{{ form.title.id_for_label }}">Stage Title <span aria-hidden="true">*</span></label>
                    {{ form.title }}
                    {{ form.title.errors }}
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Save Stage</button>
                </div>
            </form>
        </div>
    </div>

    <style>
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-card {
            background: rgba(7, 12, 31, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 40px 120px rgba(5, 9, 24, 0.4);
        }

        .modal-header {
            position: relative;
            margin-bottom: 24px;
        }

        .modal-header h1 {
            margin: 0 0 8px;
            font-size: 1.8rem;
            letter-spacing: -0.04em;
            font-weight: 700;
        }

        .modal-header p {
            margin: 0;
            color: #b3c0e5;
            font-size: 0.95rem;
        }

        .modal-close {
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 2rem;
            color: #94a3b8;
            text-decoration: none;
        }

        .project-form {
            display: grid;
            gap: 20px;
        }

        .input-group {
            display: grid;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.9rem;
            color: #d4d9f7;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: #f7f9ff;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
        }

        .input-group .errorlist {
            margin: 0;
            padding: 0;
            color: #fda4af;
            font-size: 0.9rem;
            list-style: none;
        }

        .form-actions {
            padding-top: 12px;
        }

        .btn-primary {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #5e5aff, #38bdf8);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
{% endblock %}
